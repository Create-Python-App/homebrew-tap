name: Update formula

on:
  repository_dispatch:
    types: [new-release]
  workflow_dispatch:
    inputs:
      version:
        description: "Version to update to (e.g. 0.1.0)"
        required: true

permissions:
  contents: write

jobs:
  update:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Resolve version and checksum from PyPI
        id: meta
        env:
          INPUT_VERSION: ${{ github.event.inputs.version }}
          PAYLOAD_VERSION: ${{ github.event.client_payload.version }}
        run: |
          set -euo pipefail
          VERSION="${INPUT_VERSION:-$PAYLOAD_VERSION}"
          if [ -z "$VERSION" ]; then
            VERSION=$(curl -sfL https://pypi.org/pypi/create-awesome-python-app/json | jq -r '.info.version')
          fi

          META=""
          for attempt in $(seq 1 24); do
            if META=$(curl -sfL "https://pypi.org/pypi/create-awesome-python-app/${VERSION}/json"); then
              URL=$(echo "$META" | jq -r '.urls[] | select(.packagetype=="sdist") | .url')
              SHA=$(echo "$META" | jq -r '.urls[] | select(.packagetype=="sdist") | .digests.sha256')
              if [ -n "$URL" ] && [ "$URL" != "null" ] && [ -n "$SHA" ] && [ "$SHA" != "null" ]; then
                break
              fi
            fi
            echo "::warning::PyPI not ready for create-awesome-python-app==${VERSION} (attempt ${attempt}/24); retrying in 15s"
            sleep 15
            META=""
          done

          URL=$(echo "$META" | jq -r '.urls[] | select(.packagetype=="sdist") | .url')
          SHA=$(echo "$META" | jq -r '.urls[] | select(.packagetype=="sdist") | .digests.sha256')
          if [ -z "$URL" ] || [ "$URL" = "null" ] || [ -z "$SHA" ] || [ "$SHA" = "null" ]; then
            echo "::error::Could not resolve sdist for create-awesome-python-app==${VERSION}" >&2
            exit 1
          fi
          echo "version=$VERSION" >> "$GITHUB_OUTPUT"
          echo "sha256=$SHA" >> "$GITHUB_OUTPUT"
          echo "url=$URL" >> "$GITHUB_OUTPUT"
          echo "Resolved v${VERSION}"
          echo "  url=$URL"
          echo "  sha256=$SHA"

      - name: Patch formula
        env:
          FORMULA_URL: ${{ steps.meta.outputs.url }}
          FORMULA_SHA: ${{ steps.meta.outputs.sha256 }}
        run: |
          sed -i "s|url \".*\"|url \"${FORMULA_URL}\"|" Formula/create-awesome-python-app.rb
          sed -i "s|sha256 \".*\"|sha256 \"${FORMULA_SHA}\"|" Formula/create-awesome-python-app.rb
          echo "----- Updated formula -----"
          cat Formula/create-awesome-python-app.rb

      # Branch protection on main forbids direct pushes (and requires the
      # "Formula lint" check), so automation ships the bump as a pull request.
      # PR creation requires a classic PAT with repo scope stored as the
      # TAP_RELEASE_PAT secret (used automatically when present): the org
      # policy blocks GITHUB_TOKEN from creating pull requests, so without
      # the secret this step fails after pushing the automation branch.
      # Owner setup: create PAT -> repo Settings -> Secrets -> Actions ->
      # New repository secret named TAP_RELEASE_PAT.
      - name: Open update pull request
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          TAP_RELEASE_PAT: ${{ secrets.TAP_RELEASE_PAT }}
          VERSION: ${{ steps.meta.outputs.version }}
        run: |
          set -euo pipefail
          if [ -n "${TAP_RELEASE_PAT:-}" ]; then
            GH_TOKEN="${TAP_RELEASE_PAT}"
          fi
          export GH_TOKEN
          BRANCH="automation/formula-${VERSION}"
          git config user.name "Create Python App Bot"
          git config user.email "ulisescf.24@gmail.com"
          git checkout -B "$BRANCH"
          git add Formula/create-awesome-python-app.rb
          if git diff --cached --quiet; then
            echo "Formula already current for v${VERSION}; nothing to do."
            exit 0
          fi
          git commit -m "feat: update formula to ${VERSION}"
          git push --force-with-lease origin "$BRANCH"
          if [ "$(gh pr list --head "$BRANCH" --json number --jq 'length')" -gt 0 ]; then
            echo "Update PR already open for $BRANCH"
            exit 0
          fi
          gh pr create --base main --head "$BRANCH" \
            --title "feat: update formula to ${VERSION}" \
            --body "Automated formula bump to create-awesome-python-app ${VERSION} (sdist URL + sha256 resolved from PyPI). Safe to merge once Formula lint is green."
