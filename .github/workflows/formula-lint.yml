name: Formula lint

on:
  pull_request:
  push:
    branches:
      - main

permissions:
  contents: read

jobs:
  formula-lint:
    name: Formula lint
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Ruby syntax check on all formulas
        run: |
          set -euo pipefail
          find Formula -name '*.rb' -print0 | xargs -0 -n1 ruby -c

      - name: Formulas declare a Formula class
        run: |
          set -euo pipefail
          for f in Formula/*.rb; do
            grep -Eq '^class [A-Z][A-Za-z]+ < Formula' "$f" || {
              echo "::error::$f: no 'class ... < Formula' declaration found"
              exit 1
            }
          done
          echo "All formulas OK"

      - name: ShellCheck workflows
        run: |
          set -euo pipefail
          sudo apt-get update -qq
          sudo apt-get install -y -qq shellcheck
          echo "ShellCheck version: $(shellcheck --version | head -1)"
          for wf in .github/workflows/*.yml; do
            echo "--- shellcheck $wf ---"
            shellcheck --severity=error --shell=bash --exclude=SC2148,SC2034,SC2154 "$wf" || {
              echo "::warning::$wf has shellcheck errors"
            }
          done

      - name: Version drift check (PyPI)
        run: |
          set -euo pipefail
          PYPI_VER=$(curl -sfL https://pypi.org/pypi/create-awesome-python-app/json | jq -r '.info.version')
          FORMULA_URL=$(grep -E 'url "https' Formula/*.rb | head -1 | grep -Eo 'https://[^"]+')
          FORMULA_SHA=$(grep -E 'sha256 "' Formula/*.rb | head -1 | grep -Eo '"[^"]+"' | tr -d '"')
          echo "PyPI latest: $PYPI_VER"
          echo "Formula URL: $FORMULA_URL"
          echo "Formula sha256: $FORMULA_SHA"
          PYPI_META=$(curl -sfL "https://pypi.org/pypi/create-awesome-python-app/${PYPI_VER}/json" | jq -r '.urls[] | select(.packagetype=="sdist") | "\(.url) \(.digests.sha256)"')
          PYPI_URL=$(echo "$PYPI_META" | cut -d' ' -f1)
          PYPI_SHA=$(echo "$PYPI_META" | cut -d' ' -f2)
          echo "PyPI sdist URL: $PYPI_URL"
          echo "PyPI sdist sha256: $PYPI_SHA"
          if [ "$FORMULA_URL" != "$PYPI_URL" ]; then
            echo "::warning::Formula URL differs from PyPI sdist URL"
            echo "Formula: $FORMULA_URL"
            echo "PyPI: $PYPI_URL"
          fi
          if [ "$FORMULA_SHA" != "$PYPI_SHA" ]; then
            echo "::warning::Formula sha256 differs from PyPI sha256"
          else
            echo "SHA sync OK"
          fi
          # Also check version embedded in URL
          FORMULA_VER=$(echo "$FORMULA_URL" | grep -Eo '[0-9]+\.[0-9]+\.[0-9]+' | tail -1)
          echo "Formula version in URL: $FORMULA_VER vs PyPI $PYPI_VER"
          if [ "$FORMULA_VER" != "$PYPI_VER" ]; then
            echo "::warning::Formula version ($FORMULA_VER) differs from PyPI ($PYPI_VER)"
          else
            echo "Version sync OK: $FORMULA_VER"
          fi

      - name: Setup Homebrew
        uses: Homebrew/actions/setup-homebrew@main
        with:
          token: ${{ secrets.GITHUB_TOKEN }}

      - name: Brew audit (strict)
        run: |
          set -euo pipefail
          brew audit --strict --online Formula/*.rb || brew audit --strict Formula/*.rb || {
            echo "::warning::brew audit found issues"
            exit 1
          }

      - name: Brew style
        run: |
          set -euo pipefail
          brew style Formula/*.rb || {
            echo "::warning::brew style found issues"
            exit 1
          }
